apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: greenpay
  labels:
    app: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend
          # The tag is a required placeholder that CI substitutes with an
          # immutable value (short git SHA) at deploy time via
          # scripts/render-k8s-manifests.sh. Never use the mutable `latest`
          # tag here: nodes would silently run different image versions.
          image: greenpay/backend:${GIT_SHA}
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 4000
          envFrom:
            - configMapRef:
                name: greenpay-config
            - secretRef:
                name: greenpay-secrets
          readinessProbe:
            httpGet:
              path: /health
              port: 4000
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: backend-svc
  namespace: greenpay
spec:
  selector:
    app: backend
  ports:
    - port: 4000
      targetPort: 4000
