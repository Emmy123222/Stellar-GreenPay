apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: greenpay
  labels:
    app: frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          # The tag is a required placeholder that CI substitutes with an
          # immutable value (short git SHA) at deploy time via
          # scripts/render-k8s-manifests.sh. Never use the mutable `latest`
          # tag here: nodes would silently run different image versions.
          image: greenpay/frontend:${GIT_SHA}
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
          envFrom:
            - configMapRef:
                name: greenpay-config
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 10
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: frontend-svc
  namespace: greenpay
spec:
  selector:
    app: frontend
  ports:
    - port: 3000
      targetPort: 3000
