title = "Stellar GreenPay secret scanning"

[extend]
useDefault = true

[[allowlists]]
description = "Generated distributable archives are not source files to scan."
paths = [
  '''^extension/greenpay-extension\.zip$''',
]

[[allowlists]]
description = "Environment templates contain placeholder-only values for contributors."
condition = "AND"
paths = [
  '''(^|/)\.env(\.[a-z]+)*\.example$''',
]
regexes = [
  '''(?i)(your_|yourdomain\.com|YOUR_PUBLIC_ADDRESS|PLACEHOLDER|example(?:\.com)?|localhost|testnet|postgres:postgres|CXXX|GXXX|changeme|password|secret|username)''',
  '''^$''',
]

[[allowlists]]
description = "Automated tests and mocks use deterministic dummy identifiers."
condition = "AND"
paths = [
  '''(^|/)(__tests__|__mocks__|e2e|test_snapshots)(/|$)''',
  '''\.(test|spec)\.(js|ts|tsx)$''',
]
regexes = [
  '''(?i)(mock|dummy|fixture|example|test|aaaaaaaa|bbbbbbbb|cccccccc)''',
]

[[allowlists]]
description = "Canonical AWS documentation example credentials used in unit tests."
regexes = [
  '''AKIAIOSFODNN7EXAMPLE''',
  '''wJalrXUtnFEMI/K7MDENG/bPxRfiCYEXAMPLEKEY''',
]

[[allowlists]]
description = "Demo / placeholder public Stellar addresses and doc example webhook secrets that are not real credentials."
regexes = [
  '''whsec_a3f82c1de4b5[A-Za-z0-9_\-\.]*''',
  '''GABCDEFGHIJKLMNOPQRSTUVWXYZ1234567890''',
  '''CDLZFC3SYJYDZT7K67VZ75HPJVIEUVNIXF47ZG2FB2RMQQVU2HHGCYSC''',
]
