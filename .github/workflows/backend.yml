name: Backend CI

on:
  push:
    # No `paths` filter on push: coverage must be uploaded to Codecov on every
    # main-branch push so the README badge reflects the current state (#1286).
    branches: [main, develop]
  pull_request:
    branches: [main]
    paths: [backend/**]

# ── Required Secrets ──────────────────────────────────────────────────────────
# SENTRY_DSN     — Sentry DSN for error tracking (optional). Tests pass without it.
#                  Configure as a GitHub Actions secret when deploying to production
#                  to enable error reporting in CI builds.
# CODECOV_TOKEN  — Codecov token for uploading test coverage (optional).
#                  Configured as a repository secret.
# ──────────────────────────────────────────────────────────────────────────────

jobs:
  test:
    name: Unit & Integration Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: greenpay
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      # Guard against regression of #1039: generated coverage artifacts must
      # never be committed again. They are uploaded as a CI artifact instead.
      - name: Verify coverage artifacts are not committed
        working-directory: ${{ github.workspace }}
        run: |
          tracked="$(git ls-files -- 'coverage' 'backend/coverage' 'frontend/coverage')"
          if [ -n "$tracked" ]; then
            echo "::error::Generated coverage artifacts must not be committed. Run 'git rm -r --cached backend/coverage/' and keep them in .gitignore."
            echo "$tracked"
            exit 1
          fi
          echo "OK: no coverage artifacts are tracked."

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: "npm"
          cache-dependency-path: backend/package-lock.json

      - run: npm ci

      - name: Run database migrations
        run: |
          node src/db/pgboss-migrate.js
          npm run db:migrate
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/greenpay

      - run: npm test -- --coverage
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/greenpay
          REDIS_URL: redis://localhost:6379
          SKIP_INTEGRATION: "1"

      - name: Upload coverage report artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-coverage-report
          path: backend/coverage/
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: backend/coverage/lcov.info
          flags: backend
          fail_ci_if_error: false

  migrations:
    name: DB Migrations (idempotency + lock)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: greenpay
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: backend/package-lock.json

      - run: npm ci

      - name: Run migrations twice (must be idempotent)
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/greenpay
        run: |
          npm run migrate
          npm run migrate | tee /tmp/second-migration.log
          grep -q "No pending migrations" /tmp/second-migration.log

      - name: Migration lock rejects a concurrent run
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/greenpay
        run: |
          # Hold the migration lock for 10s in the background, then assert that a
          # second run is refused instead of racing the first through the
          # pending-migration list.
          node -e "const { withMigrationLock } = require('./src/db/migrationLock'); withMigrationLock(() => new Promise((resolve) => setTimeout(resolve, 10000))).then(() => process.exit(0)).catch((err) => { console.error(err); process.exit(1); })" &
          LOCK_HOLDER_PID=$!
          sleep 2
          if MIGRATION_LOCK_TIMEOUT_SECONDS=0 npm run migrate; then
            echo "::error::A concurrent migration run acquired the lock instead of being rejected"
            kill "$LOCK_HOLDER_PID" 2>/dev/null || true
            exit 1
          fi
          wait "$LOCK_HOLDER_PID"
