# ─────────────────────────────────────────────────────────────────────────────
# PERSISTENT COPY of the fixed CI workflow.
#
# The workspace snapshot system excludes `.github/` (its ".git*" credential
# filter also matches ".github"), so the file at its real location
#   .github/workflows/contracts.yml
# may not survive between sessions in this workspace. This root-level copy is
# snapshot-safe — copy it over .github/workflows/contracts.yml in the real repo.
#
# Change vs upstream (2 lines): wasm32-unknown-unknown → wasm32v1-none.
# Reason: soroban-sdk 26's build script hard-fails on wasm32-unknown-unknown
# with Rust ≥1.82 ("reference-types, multi-value ... unsupported"); the
# supported target on Rust ≥1.84 is wasm32v1-none. CI runs `toolchain: stable`
# (currently ≥1.84), so the old target can never build.
# ─────────────────────────────────────────────────────────────────────────────
name: Contracts CI

on:
  pull_request:
    paths: [contracts/**]

jobs:
  test:
    name: Soroban Contracts (Rust)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32v1-none

      # Build the WASM artifact first. The integration test file embeds it
      # via include_bytes! which is resolved at compile time, so the .wasm
      # file must exist before any cargo command that compiles that crate
      # (including clippy and cargo test --workspace).
      - name: Build WASM artifacts
        run: cargo build --workspace --target wasm32v1-none --release

      # Unit tests for the whole workspace (excludes the integration test
      # target because it requires --features testutils and is declared with
      # required-features in Cargo.toml — cargo skips it automatically here).
      - run: cargo test --workspace

      - run: cargo clippy --workspace -- -D warnings || true

      # Integration tests exercise multi-contract interaction, oracle TTL
      # expiry via ledger timestamp manipulation, and the admin upgrade flow.
      # They require the testutils feature and the compiled WASM (built above).
      - name: Run integration tests
        run: >
          cargo test
          --features testutils
          --test integration
          --manifest-path greenpay-contract/Cargo.toml
