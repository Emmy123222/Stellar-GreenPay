name: Contracts CI

on:
  push:
    branches: [main]
    paths: [contracts/**]
  pull_request:
    branches: [main]
    paths: [contracts/**]
  # Scheduled weekly run to catch toolchain drift / rot even if no contracts files changed
  # schedule:
  #   - cron: '0 0 * * 0' # Every Sunday at midnight UTC

jobs:
  test:
    name: Soroban Contracts (Rust)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32v1-none

      # The Makefile in contracts/ is the single source of truth for these
      # commands — CI runs the exact same `make` targets developers run
      # locally, so local and CI commands cannot drift.
      #
      # Build the WASM artifact first. include_bytes! in integration.rs
      # resolves at compile time, so the .wasm must exist before cargo test
      # or cargo clippy attempt to compile the integration test crate (the
      # Makefile encodes this ordering via the test/lint dependencies).
      - name: Build WASM artifacts
        run: make build

      # Unit tests and integration tests (the `test` target builds the WASM
      # artifacts first, then runs both suites).
      - name: Run tests
        run: make test

      # Clippy stays non-blocking in CI (warnings are reported but do not
      # fail the job); the underlying `make lint` target is strict and can
      # be run locally to fail on any warning.
      - name: Run Clippy
        run: make lint || true
