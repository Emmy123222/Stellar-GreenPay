name: Contracts CI

on:
  push:
    branches: [main]
    paths: [contracts/**]
  pull_request:
    branches: [main]
    paths: [contracts/**]
  # Scheduled weekly run to catch toolchain drift / rot even if no contracts files changed
  # schedule:
  #   - cron: '0 0 * * 0' # Every Sunday at midnight UTC

jobs:
  test:
    name: Soroban Contracts (Rust)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32v1-none

      # soroban-sdk v28+ refuses plain `cargo build` for wasm targets: the
      # contract must be built with `stellar contract build` (>= v25.2.0) so
      # the contract spec can be shaken. Install the prebuilt binary.
      - name: Install Stellar CLI
        run: |
          curl -fsSL -o /tmp/stellar-cli.tar.gz \
            https://github.com/stellar/stellar-cli/releases/download/v25.2.0/stellar-cli-25.2.0-x86_64-unknown-linux-gnu.tar.gz
          sudo tar -xzf /tmp/stellar-cli.tar.gz -C /usr/local/bin stellar
          stellar --version

      # Build the WASM artifact first. include_bytes! in integration.rs
      # resolves at compile time, so the .wasm must exist before cargo test
      # or cargo clippy attempt to compile the integration test crate.
      - name: Build WASM artifacts
        run: stellar contract build

      - name: Run unit tests
        run: cargo test --workspace

      - name: Run Clippy
        run: cargo clippy --workspace -- -D warnings || true

      # Integration tests exercise multi-contract interaction, oracle TTL
      # expiry via ledger timestamp manipulation, and the admin upgrade flow.
      # They require the testutils feature and the compiled WASM (built above).
      - name: Run integration tests
        run: >
          cargo test
          --features testutils
          --test integration
          --manifest-path greenpay-contract/Cargo.toml
