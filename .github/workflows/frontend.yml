name: Frontend Build and E2E

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

# ── Required Secrets ──────────────────────────────────────────────────────────
# SENTRY_DSN  — Sentry DSN for error tracking (optional). Builds pass without it.
#               Configure as a GitHub Actions secret when deploying to production
#               to enable error reporting in CI builds.
# ──────────────────────────────────────────────────────────────────────────────

jobs:
  frontend-build-and-e2e:
    name: Frontend Build and Playwright E2E
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build
        env:
          NEXT_PUBLIC_STELLAR_NETWORK: testnet
          NEXT_PUBLIC_HORIZON_URL: https://horizon-testnet.stellar.org
          NEXT_PUBLIC_API_URL: http://localhost:4000

      - name: Install Playwright browsers
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Run Playwright tests
        working-directory: frontend
        run: npx playwright test
        env:
          CI: ""
          NEXT_PUBLIC_STELLAR_NETWORK: testnet
          NEXT_PUBLIC_HORIZON_URL: https://horizon-testnet.stellar.org
          NEXT_PUBLIC_API_URL: http://localhost:4000

      - name: Upload Playwright traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: |
            frontend/test-results/**/trace.zip
            frontend/test-results/**/*.png
            frontend/test-results/**/*.webm
            frontend/playwright-report/
          if-no-files-found: warn
          retention-days: 7
