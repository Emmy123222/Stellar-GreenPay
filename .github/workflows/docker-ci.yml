name: Docker CI

on:
  push:
    branches: [main, develop]
    paths:
      - 'Dockerfile'
      - 'backend/Dockerfile'
      - 'frontend/Dockerfile'
      - 'docker-compose*.yml'
      - 'backend/package*.json'
      - 'frontend/package*.json'
  pull_request:
    branches: [main]
    paths:
      - 'Dockerfile'
      - 'backend/Dockerfile'
      - 'frontend/Dockerfile'
      - 'docker-compose*.yml'
      - 'backend/package*.json'
      - 'frontend/package*.json'

jobs:
  compose-config:
    name: Validate Docker Compose Config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate base compose
        run: docker compose -f docker-compose.yml config -q
      - name: Validate dev compose combination
        run: docker compose -f docker-compose.yml -f docker-compose.dev.yml config -q
      - name: Validate test compose combination
        run: docker compose -f docker-compose.yml -f docker-compose.test.yml config -q

  docker-build:
    name: Build Docker Images
    runs-on: ubuntu-latest
    needs: compose-config
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build backend test stage
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          target: test
          cache-from: type=gha
          cache-to: type=gha,mode=max
          load: true
      - name: Build backend builder stage
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          target: builder
          cache-from: type=gha
          cache-to: type=gha,mode=max
          load: true
      - name: Build backend runner stage
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          target: runner
          cache-from: type=gha
          cache-to: type=gha,mode=max
          load: true
      - name: Build frontend builder stage
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          target: builder
          cache-from: type=gha
          cache-to: type=gha,mode=max
          load: true
      - name: Build frontend runner stage
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          target: runner
          cache-from: type=gha
          cache-to: type=gha,mode=max
          load: true

  hadolint:
    name: Hadolint Dockerfiles
    runs-on: ubuntu-latest
    needs: compose-config
    steps:
      - uses: actions/checkout@v4
      - name: Run hadolint on backend/Dockerfile
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: backend/Dockerfile
      - name: Run hadolint on frontend/Dockerfile
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: frontend/Dockerfile
