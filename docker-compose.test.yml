version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: greenpay_test
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d greenpay_test"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: test
    environment:
      NODE_ENV: test
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/greenpay_test
      REDIS_URL: redis://redis:6379
      STELLAR_NETWORK: testnet
      HORIZON_URL: https://horizon-testnet.stellar.org
      ALLOWED_ORIGINS: http://localhost:3000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    # The pgboss schema migration used to be a separate one-shot service,
    # but `docker compose up --exit-code-from backend` implies
    # --abort-on-container-exit, so its clean exit aborted the whole stack
    # before `npm test` ever ran. Fold it into the backend entrypoint: the
    # migration runs first, then the test suite, and the backend container's
    # exit code (the tests' code) is what the CI step returns.
    command: sh -c "node src/db/pgboss-migrate.js && npm test"
