[package]
name = "escrow-contract"
version = "0.1.0"
edition = "2021"
description = "Soroban escrow — client-funded jobs and release_escrow to freelancer"
license = "MIT"

[lib]
crate-type = ["cdylib"]

[dependencies]
soroban-sdk = "26.1.0"

[dev-dependencies]
soroban-sdk = { version = "26.1.0", features = ["testutils"] }

# [profile.release] is configured once at the workspace root (contracts/Cargo.toml)
